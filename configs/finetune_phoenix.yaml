model:
  target: spamo.t5_slt.FlanT5SLT
  
  params:     
    lr: 6.0e-4
    monitor: val/bleu4
    model_name: google/flan-t5-xl
    cache_dir: C:\Users\user\Desktop\spamo-kowshik\hf_cache
    inter_hidden: 768
    input_size: 2048
    beam_size: 5
    max_frame_len: 256
    max_txt_len: 64
    frame_sample_rate: 1
    prompt: "Translate the given sentence into {}."
    tuning_type: lora
    lora_r: 16
    lora_alpha: 32
    lora_dropout: 0.1
    fusion_mode: joint
    warm_up_steps: 0
    cross_modal_align: true
    combined_loss: true
    alpha: 1.0

lightning:
  callback:
    learning_rate_logger:
      target: pytorch_lightning.callbacks.LearningRateMonitor
      params:
        logging_interval: step
  trainer:
    accumulate_grad_batches: 8
    accelerator: gpu
    devices: 1
    max_epochs: 200
    gradient_clip_val: 1.0
    check_val_every_n_epoch: 2
    precision: bf16

data:
  target: dataset.datamodule.DataModuleFromConfig
  params:
    batch_size: 2
    num_workers: 4
  
    train:
      target: dataset.p14t.Phoenix14T
      params:
        anno_root: C:\Users\user\Desktop\spamo-kowshik\PHOENIX-2014-T-release-v3\preprocess\Phoenix14T
        vid_root: C:\Users\user\Desktop\spamo-kowshik\PHOENIX-2014-T-release-v3\PHOENIX-2014-T\features\fullFrame-210x260px
        feat_root: C:\Users\user\Desktop\spamo-kowshik\PHOENIX-2014-T-release-v3\vit_features\clip-vit-large-patch14_feat_Phoenix14T
        mae_feat_root: C:\Users\user\Desktop\spamo-kowshik\PHOENIX-2014-T-release-v3\mae_features\mae_feat_Phoenix14T
        mode: train
        spatial: true
        spatiotemporal: true
        spatial_postfix: _s2wrapping
        spatiotemporal_postfix: _overlap-8
        
    validation:
      target: dataset.p14t.Phoenix14T
      params:
        anno_root: C:\Users\user\Desktop\spamo-kowshik\PHOENIX-2014-T-release-v3\preprocess\Phoenix14T
        vid_root: C:\Users\user\Desktop\spamo-kowshik\PHOENIX-2014-T-release-v3\PHOENIX-2014-T\features\fullFrame-210x260px
        feat_root: C:\Users\user\Desktop\spamo-kowshik\PHOENIX-2014-T-release-v3\vit_features\clip-vit-large-patch14_feat_Phoenix14T
        mae_feat_root: C:\Users\user\Desktop\spamo-kowshik\PHOENIX-2014-T-release-v3\mae_features\mae_feat_Phoenix14T
        mode: test
        spatial: true
        spatiotemporal: true
        spatial_postfix: _s2wrapping
        spatiotemporal_postfix: _overlap-8
    
    test:
      target: dataset.p14t.Phoenix14T
      params:
        anno_root: C:\Users\user\Desktop\spamo-kowshik\PHOENIX-2014-T-release-v3\preprocess\Phoenix14T
        vid_root: C:\Users\user\Desktop\spamo-kowshik\PHOENIX-2014-T-release-v3\PHOENIX-2014-T\features\fullFrame-210x260px
        feat_root: C:\Users\user\Desktop\spamo-kowshik\PHOENIX-2014-T-release-v3\vit_features\clip-vit-large-patch14_feat_Phoenix14T
        mae_feat_root: C:\Users\user\Desktop\spamo-kowshik\PHOENIX-2014-T-release-v3\mae_features\mae_feat_Phoenix14T
        mode: test
        spatial: true
        spatiotemporal: true
        spatial_postfix: _s2wrapping
        spatiotemporal_postfix: _overlap-8
